<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#071124"/>
      <stop offset="55%" stop-color="#0D2137"/>
      <stop offset="100%" stop-color="#064E3B"/>
    </linearGradient>
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <rect width="1280" height="720" fill="url(#bgGrad)"/>

  <!-- Subtle geometric grid -->
  <g opacity="0.08" stroke="#34D399" stroke-width="1">
    <line x1="0" y1="120" x2="1280" y2="120"/><line x1="0" y1="240" x2="1280" y2="240"/>
    <line x1="0" y1="360" x2="1280" y2="360"/><line x1="0" y1="480" x2="1280" y2="480"/>
    <line x1="0" y1="600" x2="1280" y2="600"/>
    <line x1="256" y1="0" x2="256" y2="720"/><line x1="512" y1="0" x2="512" y2="720"/>
    <line x1="768" y1="0" x2="768" y2="720"/><line x1="1024" y1="0" x2="1024" y2="720"/>
  </g>

  <!-- Top Badge -->
  <rect x="80" y="64" width="330" height="36" rx="18" fill="#10B981" fill-opacity="0.18" stroke="#10B981" stroke-width="1.5"/>
  <text x="245" y="88" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700" fill="#34D399" text-anchor="middle" letter-spacing="1.5">SAFINUM INNOVATE CHALLENGE 2026</text>

  <!-- Main Title -->
  <text x="80" y="175" font-family="Segoe UI, Arial, sans-serif" font-size="68" font-weight="800" fill="#FFFFFF" letter-spacing="-1">SAFINUM <tspan fill="#10B981">LINGUA</tspan></text>
  <text x="80" y="228" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="400" fill="#CBD5E1">L'Infrastructure Linguistique Universelle pour la Finance Numérique</text>

  <!-- Value Props Pills -->
  <g transform="translate(80, 270)">
    <rect x="0" y="0" width="210" height="44" rx="10" fill="#0F172A" stroke="#334155"/>
    <text x="105" y="27" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="600" fill="#F8FAFC" text-anchor="middle">9 Langues Nationales</text>

    <rect x="230" y="0" width="230" height="44" rx="10" fill="#0F172A" stroke="#334155"/>
    <text x="345" y="27" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="600" fill="#F8FAFC" text-anchor="middle">6 Canaux (USSD, Web, Mobile)</text>

    <rect x="480" y="0" width="220" height="44" rx="10" fill="#0F172A" stroke="#F59E0B" stroke-opacity="0.6"/>
    <text x="590" y="27" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="600" fill="#FBBF24" text-anchor="middle">GSM-7 Strict (182 septets)</text>
  </g>

  <!-- Language Chips -->
  <text x="80" y="370" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700" fill="#94A3B8" letter-spacing="1.2">LANGUES SUPPORTÉES (ISO 639-3)</text>
  <g transform="translate(80, 390)" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="600">
    <rect x="0" y="0" width="95" height="34" rx="8" fill="#1E293B"/><text x="47" y="22" fill="#34D399" text-anchor="middle">Ewondo</text>
    <rect x="107" y="0" width="95" height="34" rx="8" fill="#1E293B"/><text x="154" y="22" fill="#34D399" text-anchor="middle">Fulfulde</text>
    <rect x="214" y="0" width="90" height="34" rx="8" fill="#1E293B"/><text x="259" y="22" fill="#34D399" text-anchor="middle">Duálá</text>
    <rect x="316" y="0" width="90" height="34" rx="8" fill="#1E293B"/><text x="361" y="22" fill="#34D399" text-anchor="middle">Ɓasaá</text>
    <rect x="418" y="0" width="100" height="34" rx="8" fill="#1E293B"/><text x="468" y="22" fill="#34D399" text-anchor="middle">Ghɔmálá</text>
    <rect x="530" y="0" width="105" height="34" rx="8" fill="#1E293B"/><text x="582" y="22" fill="#34D399" text-anchor="middle">Mə̀dûmbà</text>
    <rect x="0" y="46" width="95" height="34" rx="8" fill="#1E293B"/><text x="47" y="68" fill="#FBBF24" text-anchor="middle">Pidgin</text>
    <rect x="107" y="46" width="95" height="34" rx="8" fill="#1E293B"/><text x="154" y="68" fill="#E2E8F0" text-anchor="middle">Français</text>
    <rect x="214" y="46" width="95" height="34" rx="8" fill="#1E293B"/><text x="261" y="68" fill="#E2E8F0" text-anchor="middle">English</text>
  </g>

  <!-- Right Side: Interoperable Hub Visual -->
  <g transform="translate(810, 120)">
    <!-- Connection lines -->
    <line x1="180" y1="240" x2="60" y2="90" stroke="#10B981" stroke-width="2.5" stroke-dasharray="6,4"/>
    <line x1="180" y1="240" x2="320" y2="90" stroke="#10B981" stroke-width="2.5" stroke-dasharray="6,4"/>
    <line x1="180" y1="240" x2="180" y2="410" stroke="#F59E0B" stroke-width="2.5" stroke-dasharray="6,4"/>

    <!-- Node 1: USSD Feature Phone -->
    <rect x="0" y="20" width="140" height="100" rx="14" fill="#0F172A" stroke="#10B981" stroke-width="2"/>
    <text x="70" y="55" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="700" fill="#FFFFFF" text-anchor="middle">USSD *123#</text>
    <text x="70" y="80" font-family="Consolas, monospace" font-size="12" fill="#34D399" text-anchor="middle">GSM-7 • 182 septets</text>
    <text x="70" y="102" font-family="Segoe UI, Arial, sans-serif" font-size="11" fill="#94A3B8" text-anchor="middle">Téléphone classique</text>

    <!-- Node 2: Mobile Banking -->
    <rect x="230" y="20" width="150" height="100" rx="14" fill="#0F172A" stroke="#38BDF8" stroke-width="2"/>
    <text x="305" y="55" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="700" fill="#FFFFFF" text-anchor="middle">Mobile &amp; Web</text>
    <text x="305" y="80" font-family="Consolas, monospace" font-size="10.8" fill="#38BDF8" text-anchor="middle">UTF-8 • ui_translation</text>
    <text x="305" y="102" font-family="Segoe UI, Arial, sans-serif" font-size="11" fill="#94A3B8" text-anchor="middle">89 clés &amp; Voix TTS</text>

    <!-- Central Core Orb -->
    <circle cx="185" cy="245" r="82" fill="#064E3B" stroke="#10B981" stroke-width="3" filter="url(#glow)"/>
    <text x="185" y="236" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="800" fill="#FFFFFF" text-anchor="middle">API REST</text>
    <text x="185" y="258" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="600" fill="#34D399" text-anchor="middle">NLU + Glossaire</text>
    <text x="185" y="276" font-family="Segoe UI, Arial, sans-serif" font-size="11" fill="#CBD5E1" text-anchor="middle">X-Trace-Id • 2-Turn</text>

    <!-- Node 3: Web & Jury -->
    <rect x="85" y="385" width="200" height="95" rx="14" fill="#0F172A" stroke="#F59E0B" stroke-width="2"/>
    <text x="185" y="420" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="700" fill="#FFFFFF" text-anchor="middle">Web Banking &amp; v2</text>
    <text x="185" y="442" font-family="Consolas, monospace" font-size="12" fill="#FBBF24" text-anchor="middle">SMS • ATM/GAB • IVR</text>
    <text x="185" y="462" font-family="Segoe UI, Arial, sans-serif" font-size="11" fill="#94A3B8" text-anchor="middle">API Bancaire Simulée</text>
  </g>

  <!-- Bottom Footer -->
  <rect x="80" y="610" width="1120" height="54" rx="12" fill="#0F172A" fill-opacity="0.75" stroke="#1E293B"/>
  <text x="110" y="643" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="600" fill="#E2E8F0">Une seule infrastructure linguistique réutilisable • Zéro modification du code bancaire • Conformité Jury 100%</text>
</svg>
