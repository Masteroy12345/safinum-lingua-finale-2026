<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 700" width="1400" height="700">
  <defs>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#10B981"/>
    </marker>
    <marker id="arrBlue" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#38BDF8"/>
    </marker>
  </defs>
  <rect width="1400" height="700" fill="#0B1220"/>
  <rect x="0" y="0" width="1400" height="86" fill="#0F172A"/>
  <text x="48" y="42" font-family="Segoe UI, Arial, sans-serif" font-size="25" font-weight="800" fill="#FFFFFF">Pipeline IA Hybride : Correction, Traduction &amp; Phonétique Vocale</text>
  <text x="48" y="68" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#34D399">Double architecture : Mode Modèle Neuronal Hors-Ligne (Port 3001) &amp; Mode Lexical Mot-à-Mot (Port 3002)</text>

  <!-- Step 1: Input & Protection -->
  <g transform="translate(45, 130)" font-family="Segoe UI, Arial, sans-serif">
    <rect x="0" y="0" width="270" height="490" rx="16" fill="#111827" stroke="#334155" stroke-width="2"/>
    <rect x="0" y="0" width="270" height="48" rx="16" fill="#1E293B"/>
    <text x="135" y="30" font-size="16" font-weight="700" fill="#F8FAFC" text-anchor="middle">1. Entrée &amp; Masquage PII</text>
    <text x="20" y="80" font-size="13" font-weight="700" fill="#94A3B8">Phrase brute utilisateur :</text>
    <rect x="18" y="94" width="234" height="68" rx="8" fill="#0F172A" stroke="#475569"/>
    <text x="28" y="118" font-family="Consolas, monospace" font-size="11.5" fill="#FCA5A5">"bonjor je veu envoye</text>
    <text x="28" y="138" font-family="Consolas, monospace" font-size="11.5" fill="#FCA5A5">5 000 FCFA a 677000001"</text>

    <text x="20" y="195" font-size="13" font-weight="700" fill="#FBBF24">Protection Sentinelle :</text>
    <rect x="18" y="210" width="234" height="125" rx="8" fill="#1E293B" stroke="#F59E0B"/>
    <text x="28" y="236" font-size="12" fill="#FDE68A">• Montants (FCFA / XAF)</text>
    <text x="28" y="258" font-size="12" fill="#FDE68A">• Numéros (+237 / 6XXXXXXXX)</text>
    <text x="28" y="280" font-size="12" fill="#FDE68A">• Références (TRX- / SAF-)</text>
    <text x="28" y="302" font-size="12" fill="#FDE68A">• Opérateurs (MTN, ORANGE, ENEO)</text>
    <text x="28" y="324" font-size="12" fill="#FDE68A">• Variables UI ({amount}, {name})</text>

    <text x="20" y="370" font-size="13" font-weight="700" fill="#34D399">Détection auto langue :</text>
    <text x="20" y="395" font-size="12.5" fill="#CBD5E1">fr, en, ewo, fub, dua,</text>
    <text x="20" y="416" font-size="12.5" fill="#CBD5E1">bas, bbj, byv, wes (Pidgin)</text>
    <text x="20" y="456" font-size="12" fill="#94A3B8">Intégrité financière garantie 100%</text>
  </g>

  <line x1="315" y1="360" x2="365" y2="360" stroke="#10B981" stroke-width="3" marker-end="url(#arr)"/>

  <!-- Step 2: Correction T5 + Dual Engine -->
  <g transform="translate(370, 130)" font-family="Segoe UI, Arial, sans-serif">
    <rect x="0" y="0" width="380" height="225" rx="16" fill="#111827" stroke="#38BDF8" stroke-width="2"/>
    <rect x="0" y="0" width="380" height="44" rx="16" fill="#0369A1"/>
    <text x="190" y="28" font-size="15.5" font-weight="700" fill="#FFFFFF" text-anchor="middle">2A. Correction Phrases Entières (Port 3001)</text>
    <text x="20" y="72" font-size="13" font-weight="700" fill="#7DD3FC">Modèles T5 locaux téléchargés :</text>
    <text x="20" y="96" font-family="Consolas, monospace" font-size="12" fill="#E2E8F0">• FR : fdemelo/t5-base-spell-correction-fr</text>
    <text x="20" y="118" font-family="Consolas, monospace" font-size="12" fill="#E2E8F0">• EN : vennify/t5-base-grammar-correction</text>
    <rect x="18" y="136" width="344" height="72" rx="8" fill="#0F172A" stroke="#38BDF8"/>
    <text x="28" y="156" font-size="11.5" fill="#34D399" font-weight="700">Phrase corrigée avant traduction :</text>
    <text x="28" y="176" font-family="Consolas, monospace" font-size="11" fill="#F8FAFC">"Bonjour, je veux envoyer 5 000 FCFA</text>
    <text x="28" y="195" font-family="Consolas, monospace" font-size="11" fill="#F8FAFC"> à 677000001."</text>

    <!-- Bottom card: Dual translation -->
    <rect x="0" y="250" width="380" height="240" rx="16" fill="#111827" stroke="#10B981" stroke-width="2"/>
    <rect x="0" y="250" width="380" height="44" rx="16" fill="#059669"/>
    <text x="190" y="278" font-size="15.5" font-weight="700" fill="#FFFFFF" text-anchor="middle">2B. Moteurs de Traduction Hors-Ligne</text>
    <text x="20" y="318" font-size="13" font-weight="700" fill="#34D399">Modèle Neuronal (Service Google 3001) :</text>
    <text x="20" y="340" font-size="12" fill="#E2E8F0">• cameroon-int8 (CT2) : ewo, fub, bbj, byv, en ↔ fr</text>
    <text x="20" y="360" font-size="12" fill="#E2E8F0">• OPUS-MT-Bantu &amp; Mul : dua, bas, pcm (wes)</text>
    <text x="20" y="382" font-size="12" fill="#FBBF24">• Garde-fou gabarits financiers vérifiés</text>
    <line x1="20" y1="402" x2="360" y2="402" stroke="#334155"/>
    <text x="20" y="426" font-size="13" font-weight="700" fill="#FBBF24">Lexical Mot-à-Mot (Port 3002) :</text>
    <text x="20" y="448" font-size="12" fill="#E2E8F0">• Alignement mot-par-mot transparent</text>
    <text x="20" y="468" font-size="12" fill="#E2E8F0">• Glossaire financier certifié + entités intactes</text>
  </g>

  <line x1="750" y1="360" x2="800" y2="360" stroke="#38BDF8" stroke-width="3" marker-end="url(#arrBlue)"/>

  <!-- Step 3: Phonetics, Audio & Channel Output -->
  <g transform="translate(805, 130)" font-family="Segoe UI, Arial, sans-serif">
    <rect x="0" y="0" width="545" height="490" rx="16" fill="#111827" stroke="#A78BFA" stroke-width="2"/>
    <rect x="0" y="0" width="545" height="48" rx="16" fill="#6D28D9"/>
    <text x="272" y="30" font-size="16" font-weight="700" fill="#FFFFFF" text-anchor="middle">3. Phonétique Vocale, Audio &amp; Sortie Multicanale</text>

    <rect x="20" y="70" width="505" height="165" rx="10" fill="#1E293B" stroke="#A78BFA"/>
    <text x="35" y="96" font-size="14" font-weight="700" fill="#DDD6FE">Couche Phonétique &amp; Prononciation Sandbox Web/Mobile</text>
    <text x="35" y="122" font-size="12.5" fill="#E2E8F0">1. IPA (API) : /kɛl i lam. ŋkap 5 000 FCFA/</text>
    <text x="35" y="146" font-size="12.5" fill="#34D399">2. Web Phonétique TTS (fr-FR Sandbox) : ɛ→è, ɔ→o, ŋ→ng, ɓ→b, ɗ→d, ə→e</text>
    <text x="35" y="170" font-size="12.5" fill="#7DD3FC">3. Script TTS guidé : "Kèl i lam. Ngkap 5000 francs C F A"</text>
    <text x="35" y="194" font-size="12.5" fill="#FBBF24">4. Audio Neural WAV local : Meta MMS-TTS (ewo, ful, pcm, fra)</text>
    <text x="35" y="218" font-size="11.5" fill="#94A3B8">Permet à la Lecture Vocale du navigateur de prononcer fidèlement sans omettre ŋ/ɓ/ɗ/ɛ/ɔ</text>

    <rect x="20" y="255" width="242" height="210" rx="10" fill="#0F172A" stroke="#10B981"/>
    <text x="34" y="282" font-size="14" font-weight="700" fill="#34D399">Canal USSD (*123#)</text>
    <text x="34" y="308" font-size="12" fill="#E2E8F0">• Translittération GSM-7 strict</text>
    <text x="34" y="330" font-size="12" fill="#E2E8F0">• Compteur exact en septets</text>
    <text x="34" y="352" font-size="12" fill="#E2E8F0">• Limite &lt;= 182 septets</text>
    <text x="34" y="374" font-size="12" fill="#E2E8F0">• options: list[str]</text>
    <text x="34" y="396" font-size="12" fill="#E2E8F0">• 2 tours + X-Trace-Id</text>
    <text x="34" y="426" font-size="12" fill="#FBBF24">Réponse &lt; 50 ms (&lt; 3 s max)</text>

    <rect x="282" y="255" width="243" height="210" rx="10" fill="#0F172A" stroke="#38BDF8"/>
    <text x="296" y="282" font-size="14" font-weight="700" fill="#38BDF8">Canaux Mobile &amp; Web</text>
    <text x="296" y="308" font-size="12" fill="#E2E8F0">• Contrat ui_translation</text>
    <text x="296" y="330" font-size="12" fill="#E2E8F0">• 89 clés officielles traduites</text>
    <text x="296" y="352" font-size="12" fill="#E2E8F0">• {placeholders} 100% intacts</text>
    <text x="296" y="374" font-size="12" fill="#E2E8F0">• Respect strict max_chars</text>
    <text x="296" y="396" font-size="12" fill="#E2E8F0">• Repli dynamique IA si inédit</text>
    <text x="296" y="426" font-size="12" fill="#34D399">Cache instantané (&lt; 5 ms)</text>
  </g>
</svg>
