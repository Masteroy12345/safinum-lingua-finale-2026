<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="600" height="600">
  <defs>
    <linearGradient id="bgLogo" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#071124"/>
      <stop offset="60%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#064E3B"/>
    </linearGradient>
    <linearGradient id="emGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34D399"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FBBF24"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>
  </defs>

  <!-- Rounded Square Badge -->
  <rect x="24" y="24" width="552" height="552" rx="110" fill="url(#bgLogo)" stroke="#10B981" stroke-width="6"/>

  <!-- Subtle Orbit Ring -->
  <circle cx="300" cy="240" r="145" fill="none" stroke="#10B981" stroke-opacity="0.22" stroke-width="2.5" stroke-dasharray="10,8"/>

  <!-- Code Brackets < > + Speech/Fintech Wave -->
  <g transform="translate(300, 240)">
    <!-- Left Bracket < -->
    <path d="M -55 -60 L -115 0 L -55 60" fill="none" stroke="url(#emGrad)" stroke-width="18" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Right Bracket > -->
    <path d="M 55 -60 L 115 0 L 55 60" fill="none" stroke="url(#emGrad)" stroke-width="18" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Center Linguistic / Signal Bars -->
    <rect x="-26" y="-22" width="12" height="44" rx="6" fill="url(#goldGrad)"/>
    <rect x="-6" y="-44" width="12" height="88" rx="6" fill="#FFFFFF"/>
    <rect x="14" y="-28" width="12" height="56" rx="6" fill="url(#goldGrad)"/>

    <!-- Network Nodes -->
    <circle cx="-115" cy="0" r="9" fill="#FBBF24"/>
    <circle cx="115" cy="0" r="9" fill="#FBBF24"/>
  </g>

  <!-- Team Name -->
  <text x="300" y="450" font-family="Segoe UI, Arial, sans-serif" font-size="48" font-weight="800" fill="#FFFFFF" text-anchor="middle" letter-spacing="1">DEV SPACE <tspan fill="#10B981">ICT</tspan></text>
  <text x="300" y="492" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="700" fill="#FBBF24" text-anchor="middle" letter-spacing="3">SAFINUM LINGUA • 2026</text>
</svg>
