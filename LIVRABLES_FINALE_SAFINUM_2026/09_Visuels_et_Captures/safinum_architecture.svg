<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 820" width="1400" height="820">
  <defs>
    <marker id="arrowGreen" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#10B981"/>
    </marker>
    <marker id="arrowBlue" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#0284C7"/>
    </marker>
    <marker id="arrowGold" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#D97706"/>
    </marker>
  </defs>

  <rect width="1400" height="820" fill="#F8FAFC"/>

  <!-- Header -->
  <rect x="0" y="0" width="1400" height="90" fill="#0F172A"/>
  <text x="48" y="44" font-family="Segoe UI, Arial, sans-serif" font-size="26" font-weight="800" fill="#FFFFFF">Architecture Technique — <tspan fill="#10B981">Safinum Lingua Middleware</tspan></text>
  <text x="48" y="70" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#94A3B8">Interopérabilité linguistique multicanale • Propagation stricte X-Trace-Id • Confirmation en 2 tours</text>

  <!-- Column 1: Canaux Digitaux -->
  <text x="155" y="135" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="800" fill="#0F172A" text-anchor="middle" letter-spacing="1">1. CANAUX DIGITAUX</text>

  <g transform="translate(40, 155)" font-family="Segoe UI, Arial, sans-serif">
    <rect x="0" y="0" width="230" height="84" rx="12" fill="#FFFFFF" stroke="#10B981" stroke-width="2"/>
    <text x="18" y="30" font-size="15" font-weight="700" fill="#0F172A">USSD (*123#)</text>
    <text x="18" y="52" font-size="12" fill="#059669" font-weight="600">Actif • GSM-7 • 182 septets</text>
    <text x="18" y="70" font-size="11" fill="#64748B">Timeout: 3 s • Mode: Menu</text>

    <rect x="0" y="100" width="230" height="84" rx="12" fill="#FFFFFF" stroke="#10B981" stroke-width="2"/>
    <text x="18" y="130" font-size="15" font-weight="700" fill="#0F172A">Mobile Banking</text>
    <text x="18" y="152" font-size="12" fill="#059669" font-weight="600">Actif • UTF-8 • ui_translation</text>
    <text x="18" y="170" font-size="11" fill="#64748B">89 clés • Lecture vocale TTS</text>

    <rect x="0" y="200" width="230" height="84" rx="12" fill="#FFFFFF" stroke="#10B981" stroke-width="2"/>
    <text x="18" y="230" font-size="15" font-weight="700" fill="#0F172A">Web Banking</text>
    <text x="18" y="252" font-size="12" fill="#059669" font-weight="600">Actif • UTF-8 • ui_translation</text>
    <text x="18" y="270" font-size="11" fill="#64748B">Timeout: 10 s • + Extension Chrome</text>

    <rect x="0" y="315" width="230" height="75" rx="12" fill="#F1F5F9" stroke="#94A3B8" stroke-dasharray="5,4"/>
    <text x="18" y="344" font-size="14" font-weight="700" fill="#334155">SMS Banking (v2 prêt)</text>
    <text x="18" y="366" font-size="11" fill="#64748B">Asynchrone • 160/153 septets GSM-7</text>

    <rect x="0" y="405" width="230" height="75" rx="12" fill="#F1F5F9" stroke="#94A3B8" stroke-dasharray="5,4"/>
    <text x="18" y="434" font-size="14" font-weight="700" fill="#334155">Guichet ATM / GAB (v2 prêt)</text>
    <text x="18" y="456" font-size="11" fill="#64748B">Retraits multiples de 5 000 FCFA</text>

    <rect x="0" y="495" width="230" height="75" rx="12" fill="#F1F5F9" stroke="#94A3B8" stroke-dasharray="5,4"/>
    <text x="18" y="524" font-size="14" font-weight="700" fill="#334155">Serveur Vocal IVR (v2 prêt)</text>
    <text x="18" y="546" font-size="11" fill="#64748B">Audio 16 kHz / 8 kHz • Réponse texte</text>
  </g>

  <!-- Column 2: Safinum Gateway -->
  <text x="415" y="135" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="800" fill="#0F172A" text-anchor="middle" letter-spacing="1">2. GATEWAY</text>
  <rect x="330" y="290" width="170" height="220" rx="16" fill="#0284C7" fill-opacity="0.1" stroke="#0284C7" stroke-width="2.5"/>
  <text x="415" y="345" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="800" fill="#0369A1" text-anchor="middle">Safinum</text>
  <text x="415" y="370" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="800" fill="#0369A1" text-anchor="middle">Gateway</text>
  <rect x="348" y="395" width="134" height="32" rx="6" fill="#0284C7"/>
  <text x="415" y="416" font-family="Consolas, monospace" font-size="12" font-weight="700" fill="#FFFFFF" text-anchor="middle">Génère X-Trace-Id</text>
  <text x="415" y="455" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#334155" text-anchor="middle">Valide JSON, Intent,</text>
  <text x="415" y="473" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#334155" text-anchor="middle">GSM-7 &amp; Timeout</text>

  <!-- Arrows Col 1 -> Col 2 -->
  <line x1="270" y1="200" x2="328" y2="340" stroke="#0284C7" stroke-width="2" marker-end="url(#arrowBlue)"/>
  <line x1="270" y1="300" x2="328" y2="380" stroke="#0284C7" stroke-width="2" marker-end="url(#arrowBlue)"/>
  <line x1="270" y1="400" x2="328" y2="415" stroke="#0284C7" stroke-width="2" marker-end="url(#arrowBlue)"/>

  <!-- Column 3: Safinum Lingua Core -->
  <text x="745" y="135" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="800" fill="#065F46" text-anchor="middle" letter-spacing="1">3. SAFINUM LINGUA (MIDDLEWARE FASTAPI)</text>
  <rect x="555" y="155" width="380" height="570" rx="20" fill="#0F172A" stroke="#10B981" stroke-width="3"/>

  <g transform="translate(580, 185)" font-family="Segoe UI, Arial, sans-serif">
    <!-- Module 1 -->
    <rect x="0" y="0" width="330" height="112" rx="12" fill="#1E293B" stroke="#10B981" stroke-width="1.5"/>
    <text x="18" y="30" font-size="16" font-weight="700" fill="#34D399">A. Détection &amp; NLU Multilingue</text>
    <text x="18" y="54" font-size="12.5" fill="#E2E8F0">• 9 langues : fr, en, ewo, fub, dua, bas, bbj, byv, wes</text>
    <text x="18" y="74" font-size="12.5" fill="#E2E8F0">• Détection auto si language=null</text>
    <text x="18" y="94" font-size="12.5" fill="#E2E8F0">• Extraction 13 intentions + montants + numéros</text>

    <!-- Module 2 -->
    <rect x="0" y="130" width="330" height="112" rx="12" fill="#1E293B" stroke="#38BDF8" stroke-width="1.5"/>
    <text x="18" y="160" font-size="16" font-weight="700" fill="#38BDF8">B. Modèles IA, UI &amp; Phonétique</text>
    <text x="18" y="184" font-size="12.5" fill="#E2E8F0">• CTranslate2 + OPUS-MT + Correction T5</text>
    <text x="18" y="204" font-size="12.5" fill="#E2E8F0">• Mobile/Web ui_translation (89 clés, max_chars)</text>
    <text x="18" y="224" font-size="12.5" fill="#E2E8F0">• Phonétique IPA / TTS fr-FR / MMS-TTS</text>

    <!-- Module 3 -->
    <rect x="0" y="260" width="330" height="112" rx="12" fill="#1E293B" stroke="#F59E0B" stroke-width="1.5"/>
    <text x="18" y="290" font-size="16" font-weight="700" fill="#FBBF24">C. Optimiseur GSM-7 &amp; Contraintes</text>
    <text x="18" y="314" font-size="12.5" fill="#E2E8F0">• Compteur exact en septets (€ = 2 septets)</text>
    <text x="18" y="334" font-size="12.5" fill="#E2E8F0">• Translittération ɛ/ɔ/ŋ/ə/ɓ/ɗ -> GSM-7 strict</text>
    <text x="18" y="354" font-size="12.5" fill="#E2E8F0">• Gabarits compacts USSD (&lt;= 182 septets)</text>

    <!-- Module 4 -->
    <rect x="0" y="390" width="330" height="118" rx="12" fill="#1E293B" stroke="#A78BFA" stroke-width="1.5"/>
    <text x="18" y="420" font-size="16" font-weight="700" fill="#C4B5FD">D. Session Cross-Canal &amp; Sécurité</text>
    <text x="18" y="444" font-size="12.5" fill="#E2E8F0">• État partagé par téléphone (USSD ↔ Mobile ↔ Web)</text>
    <text x="18" y="464" font-size="12.5" fill="#E2E8F0">• Confirmation en 2 tours (jamais même X-Trace-Id)</text>
    <text x="18" y="484" font-size="12.5" fill="#E2E8F0">• Correction avant confirmation (/update)</text>
  </g>

  <!-- Arrow Gateway -> Middleware -->
  <line x1="500" y1="400" x2="553" y2="400" stroke="#10B981" stroke-width="3" marker-end="url(#arrowGreen)"/>
  <text x="526" y="388" font-family="Consolas, monospace" font-size="11" font-weight="700" fill="#059669" text-anchor="middle">POST</text>

  <!-- Column 4: Bank API & Jury Dashboard -->
  <text x="1180" y="135" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="800" fill="#0F172A" text-anchor="middle" letter-spacing="1">4. BACKEND &amp; ÉVALUATION</text>

  <g transform="translate(1010, 175)" font-family="Segoe UI, Arial, sans-serif">
    <rect x="0" y="0" width="340" height="250" rx="16" fill="#FFFFFF" stroke="#0F172A" stroke-width="2"/>
    <rect x="0" y="0" width="340" height="46" rx="16" fill="#0F172A"/>
    <text x="170" y="29" font-size="16" font-weight="700" fill="#FFFFFF" text-anchor="middle">API Bancaire Simulée (safinum.cm/api/v1)</text>
    <text x="20" y="76" font-family="Consolas, monospace" font-size="12.5" fill="#059669" font-weight="700">GET  /accounts/{phone}</text>
    <text x="20" y="102" font-family="Consolas, monospace" font-size="12.5" fill="#059669" font-weight="700">GET  /accounts/{phone}/transactions</text>
    <text x="20" y="128" font-family="Consolas, monospace" font-size="12.5" fill="#059669" font-weight="700">GET  /beneficiaries?q=... &amp; /fees</text>
    <text x="20" y="154" font-family="Consolas, monospace" font-size="12.5" fill="#0284C7" font-weight="700">POST /transactions (pending)</text>
    <text x="20" y="180" font-family="Consolas, monospace" font-size="12.5" fill="#0284C7" font-weight="700">POST /transactions/{id}/update</text>
    <text x="20" y="206" font-family="Consolas, monospace" font-size="12.5" fill="#D97706" font-weight="700">POST /transactions/{id}/confirm</text>
    <text x="20" y="232" font-family="Consolas, monospace" font-size="12.5" fill="#DC2626" font-weight="700">POST /transactions/{id}/cancel</text>

    <rect x="0" y="300" width="340" height="190" rx="16" fill="#FFFBEB" stroke="#D97706" stroke-width="2"/>
    <text x="170" y="335" font-size="17" font-weight="800" fill="#92400E" text-anchor="middle">Dashboard du Jury</text>
    <text x="24" y="368" font-size="13" fill="#78350F">✓ Corrélation X-Trace-Id vérifiée</text>
    <text x="24" y="394" font-size="13" fill="#78350F">✓ Intentions &amp; paramètres extraits</text>
    <text x="24" y="420" font-size="13" fill="#78350F">✓ 10 scénarios standardisés validés</text>
    <text x="24" y="446" font-size="13" fill="#78350F">✓ Diagnostics temps réel (latence, GSM-7)</text>
    <text x="24" y="472" font-size="13" fill="#78350F">✓ Preuve d'appels bancaires (no NO_BANK_CALL)</text>
  </g>

  <!-- Arrows Middleware -> Bank API & Jury -->
  <line x1="935" y1="300" x2="1008" y2="300" stroke="#10B981" stroke-width="3" marker-end="url(#arrowGreen)"/>
  <text x="971" y="280" font-family="Consolas, monospace" font-size="10.5" font-weight="700" fill="#0F172A" text-anchor="middle">X-Team-Key</text>
  <text x="971" y="293" font-family="Consolas, monospace" font-size="10.5" font-weight="700" fill="#059669" text-anchor="middle">X-Trace-Id</text>

  <line x1="1180" y1="425" x2="1180" y2="473" stroke="#D97706" stroke-width="2.5" marker-end="url(#arrowGold)"/>
</svg>
